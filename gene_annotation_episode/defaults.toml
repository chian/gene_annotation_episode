[models.connection]
command = ["codex", "app-server", "--stdio"]

[models.FAST]
model = "gpt-6-luna"
reasoning_effort = "none"

[models.REASONING]
model = "gpt-6-sol"
reasoning_effort = "medium"

[models.routing]
decide = "REASONING"
child_interpretation = "REASONING"

[controller]
cost = 0.001
window_size = 8
subsample_size = 4
uncertainty_alpha = 0.05

[scientific_progress]
# Provisional information units, independent of annotation-support hypervolume.
# Existing knowledge belongs to the caller; resume restores its original set.
finding_unit = 1
loss_preview_size = 24
initial_known_record_refs = []

[restoration]
# Own-decision metadata rows supplied to a new provider conversation.
# This controls transport preview size, never Episode work or continuation.
preview_size = 24

[local_tools]
# Explicit native thread choice; --cpu prevents an environment override.
# cmsearch_executable is supplied by the caller when installed.
cmsearch_cpu = 1
# Native indexed mapping is available only when the caller supplies its binary.
# The derived cache defaults to this workspace's cache/minimap2; callers can set
# minimap2_cache_dir explicitly. Neither setting fixes resources for later work.
minimap2_cpu = 1

[local_jobs]
# Caller-owned operational limits; Episodes cannot override these in tool arguments.
# Scratch is an aggregate monitored limit (possible overshoot), with a hard
# per-file limit. Time is intentionally unset pending the user's yield/credit
# design. These are not scientific stopping rules or score thresholds.
memory_bytes = 21474836480
scratch_bytes = 4294967296

[local_resources]
# Shared host/account budget for this application's local native jobs.
# Each job reserves its allocation before dispatch, across registries and runs.
max_running_jobs = 1
cpu_threads = 1
memory_bytes = 21474836480
scratch_bytes = 4294967296
