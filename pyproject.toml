    "gene_annotation_episode/episodic_workflow/root/a106",
    "gene_annotation_episode/episodic_workflow/root/a107",
    "gene_annotation_episode/episodic_workflow/root/a108",
    "gene_annotation_episode/episodic_workflow/root/a110",
