[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-annotation-episode"
version = "0.2.0"
description = "Controlled iterative biological annotation through method_loop"
requires-python = ">=3.11"
dependencies = ["biopython>=1.85,<2", "jsonschema>=4.23,<5", "numpy>=2,<3", "scipy>=1.14,<2", "pyrodigal>=3.7,<4", "pyhmmer>=0.12,<0.13", "requests>=2.32,<3", "Pillow>=11,<13", "cobra>=0.32,<0.33", "h5py>=3.16,<4", "pandas>=2.3,<3", "pyliftover>=0.4,<0.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
gene-episode = "gene_annotation_episode.cli:main"

[tool.setuptools.packages.find]
include = ["gene_annotation_episode*", "method_loop*"]
exclude = ["tests*", "_superseded*"]

[tool.setuptools.package-data]
"gene_annotation_episode.episodic_workflow.root.a110.library.received_execution_information" = ["bvbrc_appservice_schemas.json"]
"gene_annotation_episode.episodic_workflow.root.a101.tests" = ["fixtures/source_request_assembly/*.txt", "fixtures/recursive_scientific_parent/*.txt", "fixtures/other_task_runtime_providers/*.txt"]
"gene_annotation_episode.episodic_workflow.root.a101.scientific_process.tests" = ["fixtures/*.txt"]
"gene_annotation_episode.episodic_workflow.root.a102.tests" = ["fixtures/source_request_assembly/*.txt", "fixtures/resource_task_decision_original/*.txt", "fixtures/resource_task_decision_original/*.json", "fixtures/annotation_parent_boundaries/*.json"]
"gene_annotation_episode.episodic_workflow.root.a102.library.tests" = ["fixtures/report_schema_ownership/*.py.source", "fixtures/report_schema_ownership/*.json", "fixtures/original_providers/*.py.source", "fixtures/original_providers/*.json", "fixtures/hpc_handoff_contract/*.py.source", "fixtures/hpc_handoff_contract/*.json"]
"gene_annotation_episode.episodic_workflow.root.a102.scientific_process.tests" = ["fixtures/scientific_owner_placement/*.py.source", "fixtures/scientific_owner_placement/*.json"]
"gene_annotation_episode.episodic_workflow.root.a103" = ["defaults.toml"]
"gene_annotation_episode.episodic_workflow.root.a103.tests" = ["fixtures/source_request_assembly/*.txt", "fixtures/resource_task_decision_original/*.txt", "fixtures/resource_task_decision_original/*.json", "fixtures/homology_boundary_original/*.txt", "fixtures/homology_boundary_original/*.json", "fixtures/source_investigation/*.xml", "fixtures/scientific_parent_exchange/selected_original.py.txt", "fixtures/commissioning_policy/*.py.source", "fixtures/commissioning_policy/*.json", "fixtures/hierarchy_exchange/*.source", "fixtures/hierarchy_exchange/*.json"]
"gene_annotation_episode.episodic_workflow.root.a103.library.tests" = ["fixtures/report_schema_ownership/*.py.source", "fixtures/report_schema_ownership/*.json", "fixtures/original_providers/*.py.source", "fixtures/original_providers/*.json"]
"gene_annotation_episode.episodic_workflow.root.a103.scientific_process.tests" = ["fixtures/scientific_owner_placement/*.py.source", "fixtures/scientific_owner_placement/*.json"]
"gene_annotation_episode.episodic_workflow.root.a104.tests" = ["fixtures/organization_boundaries/*.json", "fixtures/homology_family/*.txt", "fixtures/source_grading/*.txt", "fixtures/source_investigation/*.xml", "fixtures/source_request_assembly/*.txt"]
"gene_annotation_episode.episodic_workflow.root.a105.tests" = ["fixtures/implicit_annotation_parent/*.json", "fixtures/implicit_annotation_parent/*.py.source"]
"gene_annotation_episode.episodic_workflow.root.a105.library.tests" = ["fixtures/registered_providers/*.json", "fixtures/registered_policy/*.json", "fixtures/registered_policy/*.py.source"]
"gene_annotation_episode.episodic_workflow.root.a106.tests" = ["fixtures/implicit_annotation_parent/*.json", "fixtures/implicit_annotation_parent/*.py.source", "fixtures/recursive_scientific_parent/*.txt", "fixtures/registered_provider_originals/*.txt"]
"gene_annotation_episode.episodic_workflow.root.a106.scientific_process.tests" = ["fixtures/*.txt"]
"gene_annotation_episode.episodic_workflow.root.a108.tests" = ["fixtures/implicit_annotation_parent/*.json", "fixtures/implicit_annotation_parent/*.py.source"]
"gene_annotation_episode.episodic_workflow.root.a108.library.tests" = ["fixtures/registered_providers/*.json", "fixtures/registered_policy/*.json"]
"gene_annotation_episode.episodic_workflow.root.a104.execution_instruction_library" = ["*.md"]
"gene_annotation_episode.episodic_workflow.root.tests" = [
    "fixtures/root_policy_original/*.json",
    "fixtures/root_policy_original/*.py.source",
    "fixtures/hpc_prediction/*.json",
    "fixtures/blast_producer_identity/original_native6_bundle.json",
