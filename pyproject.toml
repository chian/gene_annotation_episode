"gene_annotation_episode.episodic_workflow.root.execution_monitoring.tests" = ["fixtures/original_boundary/*.source", "fixtures/monitor_descriptor_sources/*.json"]
"gene_annotation_episode.episodic_workflow.root.homology_job_submission.tests" = ["fixtures/original_boundary/*.source", "fixtures/homology_selected_job_branches/*.py.source", "fixtures/homology_selected_job_branches/*.json", "fixtures/homology_source_identity/*.json", "fixtures/native_type_ownership/*.py.source", "fixtures/native_type_ownership/*.json"]
"gene_annotation_episode.episodic_workflow.root.a107.tests" = ["fixtures/organization_original/*.source", "fixtures/organization_original/*.json", "fixtures/organization_preservation/*.json"]
"gene_annotation_episode.episodic_workflow.root.a107.library.tests" = ["fixtures/original_providers/*.py.source", "fixtures/original_providers/*.json", "fixtures/hpc_handoff_contract/*.json", "fixtures/hpc_handoff_contract/*.py.source"]
"gene_annotation_episode.episodic_workflow.root.a110.tests" = ["fixtures/received_execution_original/*.source", "fixtures/organization_original/*.source", "fixtures/organization_original/*.json", "fixtures/organization_preservation/*.json"]
"gene_annotation_episode.episodic_workflow.root.a110.library.tests" = ["fixtures/original_providers/*.py.source", "fixtures/original_providers/*.json", "fixtures/hpc_handoff_contract/*.json", "fixtures/hpc_handoff_contract/*.py.source"]
"gene_annotation_episode.episodic_workflow.root.a110.library.received_execution_dependencies" = ["*.json", "adapter_source_custody/*.source"]
"gene_annotation_episode.execution_instruction_library" = ["*.md"]
gene_annotation_episode = ["defaults.toml", "vendor/*.txt", "vendor/*.json", "vendor/LICENSE*", "knowledge/*.json", "knowledge/*.md", "launch_instruction_library/*.json", "launch_instruction_library/*.md", "bvbrc_application_specs/MANIFEST.json", "bvbrc_application_specs/original/*.json", "bvbrc_application_specs/derived/*.json", "bvbrc_application_specs/README.md", "bvbrc_appservice_schemas.json", "bvbrc_proteome_native_schemas.json", "bvbrc_proteome_data_schemas.json", "bvbrc_proteome_sheet_schemas.json", "bvbrc_proteome_bundle_schemas.json", "bvbrc_proteome_directional_schemas.json", "bvbrc_proteome_directional_numerical_schemas.json", "bvbrc_proteome_bundle_v2_schemas.json", "bvbrc_comparative_systems_handoff_schemas.json", "bvbrc_fastqutils_schemas.json", "bvbrc_fastqutils_legacy_v2_schemas.json", "bvbrc_fastqutils_legacy_cutadapt_schemas.json", "literature_assay_grading_legacy_cells_v1.json"]
method_loop = ["LICENSE", "SOURCE.json", "LOCAL_PATCHES.json"]

