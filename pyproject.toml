[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-annotation-episode"
version = "0.2.0"
description = "Controlled iterative biological annotation through method_loop"
requires-python = ">=3.11"
dependencies = ["biopython>=1.85,<2", "jsonschema>=4.23,<5", "numpy>=2,<3", "scipy>=1.14,<2", "pyrodigal>=3.7,<4", "pyhmmer>=0.12,<0.13", "requests>=2.32,<3", "Pillow>=11,<13", "cobra>=0.32,<0.33", "h5py>=3.16,<4", "pandas>=2.3,<3", "pyliftover>=0.4,<0.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
gene-episode = "gene_annotation_episode.cli:main"

[tool.setuptools.packages.find]
include = ["gene_annotation_episode*", "method_loop*", "episode_runtime*"]
exclude = ["tests*", "_superseded*"]

[tool.setuptools.package-data]
"gene_annotation_episode.episodic_workflow.episode_support.configuration.gene_context_evidence" = ["defaults.toml"]
"gene_annotation_episode.episodic_workflow.episode_support.grading.gene_context_evidence.tests" = ["fixtures/source_investigation/*.xml"]
"gene_annotation_episode.episodic_workflow.episode_support.acquisition.evolutionary_history_evidence.tests" = ["fixtures/source_investigation/*.xml"]
"gene_annotation_episode.episodic_workflow.episode_support.instructions.execution" = ["*.md", "partner_presence_evidence/*.md"]
"gene_annotation_episode.episodic_workflow.root.tests" = ["fixtures/hpc_prediction/*.json", "fixtures/public_callers/inert_native", "fixtures/public_callers/references.faa", "fixtures/public_callers/policy.py", "fixtures/fresh_decision_binding.json", "fixtures/homer_v51_selected_region_inputs.zip"]
gene_annotation_episode = ["defaults.toml", "vendor/*.json", "vendor/LICENSE*", "knowledge/*.json", "knowledge/*.md", "launch_instruction_library/*.json", "launch_instruction_library/*.md", "bvbrc_fastqutils_schemas.json"]
method_loop = ["LICENSE", "SOURCE.json", "LOCAL_PATCHES.json"]

[tool.pytest.ini_options]
testpaths = [
    "episode_runtime/tests",
    "tests",
    "gene_annotation_episode/episodic_workflow/root/tests",
    "gene_annotation_episode/episodic_workflow/root/a101",
    "gene_annotation_episode/episodic_workflow/root/a102",
    "gene_annotation_episode/episodic_workflow/root/a103",
    "gene_annotation_episode/episodic_workflow/root/a104",
    "gene_annotation_episode/episodic_workflow/root/a105",
    "gene_annotation_episode/episodic_workflow/root/a106",
    "gene_annotation_episode/episodic_workflow/root/a107",
    "gene_annotation_episode/episodic_workflow/root/a108",
    "gene_annotation_episode/episodic_workflow/root/a110",
    "gene_annotation_episode/episodic_workflow/episode_support",
]
pythonpath = [
    ".",
    "tests",
    "gene_annotation_episode/episodic_workflow/root/tests",
    "gene_annotation_episode/episodic_workflow/root/a110/tests",
]
markers = [
    "model_run: a real episode run that calls the model; select with -m model_run",
]
addopts = "-m 'not model_run'"
cache_dir = "runs/pytest-cache"
norecursedirs = ["fixtures", "__pycache__", "runs", "verification"]
