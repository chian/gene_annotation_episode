<figcaption><p>Overall Structure of IscR bound to the <em>hya</em> promoter.</p>
<p>(a)The IscR dimer is shown as a ribbon representation, with the monomeric subunits colored purple and cyan and the DNA rendered as a stick model. The positions of the ligating residues in IscR are shown as large spheres with Ala92, Ala98, and Ala104 in purple and His107 in pink. This cluster binding region is in close proximity of to the wHTH DNA binding domain of the adjacent monomer. The −35 hexamer of the <em>hya</em> promoter is shown in red. Electron density is not apparent for residues beyond residue numbers 136 and 144 in the two IscR subunits for the subunits shown in purple and cyan, respectively.</p>
<p>(b) Cartoon representation of an IscR monomer. The dashed line indicates residues for which electron density was missing.</p>
<p>(c) Superposition of B-form DNA (red) and the IscR bound <em>hya</em> promoter (blue).</p></figcaption></figure>
