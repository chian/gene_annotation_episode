<figcaption><p>Model for IscR discrimination between type 1 and type 2 motifs.</p>
<p>Interactions of apo and [2Fe-2S] IscR at type 1 and type 2 sites are shown. The side chains of Glu43 (black), Ser40 (gray), and Gln44 (gray) of the recognition helix (RH) make contacts to the DNA major groove and Arg59 (gray) of the wing (W) contacts the minor groove. A black diamond on IscR indicates the presence of a [2Fe-2S] cluster. The key nucleotides in the <em>hya</em> type 2 site or conserved positions in type 1 sites are represented in bold by A (adenine), T (thymine), C (cytosine), or G (guanine).</p>
<p>(a) The contacts between apo-IscR and the type 2 site. Glu43 of apo-IscR interacts with a C<sub>7</sub>C<sub>8</sub> dinucleotide in one half site and C<sub>7'</sub>A<sub>8'</sub> the other half site. Additional contacts are made by Arg59 with the minor groove, Ser40 with an A or G, and Gln44 with T.</p>
<p>(b) The contacts between [2Fe-2S]-IscR and the type 2 site are the same for apo-IscR, described in panel a.</p>
<p>(c) The lack of interaction of apo-IscR with the type 1 site is indicated by the starburst.</p>
<p>(d) The contacts between [2Fe-2S]-IscR and the type 1 site. Displacement of the Glu43 (black) side chain from the major groove is indicated by the outward-pointing arrows. The interaction of Arg59 with the minor groove is the same as in panels a and b. Question marks represent uncertainty about the site of the interaction of Ser40 and Gln44 with conserved nucleotides in the type 1 site.</p></figcaption></figure>
